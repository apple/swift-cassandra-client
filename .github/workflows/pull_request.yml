name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_project_name: "Swift Cassandra Client"
      api_breakage_check_enabled: false
      # The documentation check fails on Swift 6.4 on the bundled libuv headers. Remove once this is fixed:
      # https://github.com/swiftlang/swift-package-manager/issues/10658
      docs_check_container_image: "swift:6.3-noble"

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit_tests.yml
    with:
      linux_6_2_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_3_arguments_override: "--explicit-target-dependency-import-check error"
      linux_6_4_arguments_override: "--explicit-target-dependency-import-check error"
      linux_nightly_next_arguments_override: "--explicit-target-dependency-import-check error"
      linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@main

  macos-tests:
    name: macOS tests
    uses: apple/swift-nio/.github/workflows/macos_tests.yml@main
    with:
      build_scheme: swift-cassandra-client
      swift_test_enabled: false  # requires running Cassandra server
      swift_6_1_enabled: false  # the package requires Swift 6.2.3
      watchos_xcode_build_enabled: false  # posix API availability
      tvos_xcode_build_enabled: false  # posix API availability
      runner_pool: general

  static-sdk:
    name: Static SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@main

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
